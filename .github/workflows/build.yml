name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  generate-version-number:
    runs-on: ubuntu-latest

    outputs:
      version_number: ${{ steps.version.outputs.version_number }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install the tool dependencies
      uses: jdx/mise-action@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: scripts/install-dependencies.sh

    - name: Generate version and build numbers
      id: version
      run: |
        source scripts/environment.sh
        VERSION_NUMBER=`changes version`
        BUILD_NUMBER=`build-tools generate-build-number`
        echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  firmware-build:
    runs-on: ubuntu-latest

    needs:
    - generate-version-number

    container:
      image: zmkfirmware/zmk-build-arm:stable

    env:
      VERSION_NUMBER: ${{ needs.generate-version-number.outputs.version_number }}
      BUILD_NUMBER: ${{ needs.generate-version-number.outputs.build_number }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Allow git to operate on the checkout
      run: git config --global --add safe.directory '*'

    - name: Cache west modules
      uses: actions/cache@v4
      with:
        path: |
          modules/
          tools/
          zephyr/
          bootloader/
          zmk/
        key: ${{ runner.os }}-zmk-${{ hashFiles('keyboard-firmware/west.yml') }}
        restore-keys: |
          ${{ runner.os }}-zmk-

    - name: Initialize the west workspace
      run: |
        west init -l keyboard-firmware
        west update --fetch-opt=--filter=tree:0
        west zephyr-export

    - name: Generate the about macro
      run: |
        scripts/generate-about-macro.sh \
          keyboard-firmware/boards/shields/little_luggable/version.dtsi \
          "Little Luggable $VERSION_NUMBER $BUILD_NUMBER"
        cat keyboard-firmware/boards/shields/little_luggable/version.dtsi

    - name: Build the firmware
      run: |
        mkdir -p artifacts
        build() {
          local board="$1"
          local name="$2"
          west build -s zmk/app -d "build/$name" -b "$board" -- \
            -DZMK_CONFIG="$PWD/keyboard-firmware" \
            -DSHIELD=little_luggable
          cp "build/$name/zephyr/zmk.uf2" "artifacts/$name.uf2"
        }
        build "nice_nano@1.0.0//zmk" "little-luggable-nice-nano-v1"
        build "nice_nano@2.0.0//zmk" "little-luggable-nice-nano-v2"

    - name: Archive the firmware
      uses: actions/upload-artifact@v7
      with:
        name: firmware
        path: artifacts/*
        if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}

    needs:
    - generate-version-number
    - firmware-build

    permissions:
      contents: write

    outputs:
      released: ${{ steps.publish.outputs.released }}

    env:
      VERSION_NUMBER: ${{ needs.generate-version-number.outputs.version_number }}
      BUILD_NUMBER: ${{ needs.generate-version-number.outputs.build_number }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install the tool dependencies
      uses: jdx/mise-action@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: scripts/install-dependencies.sh

    - name: Download the firmware artifacts
      uses: actions/download-artifact@v8
      with:
        name: firmware
        path: artifacts

    - name: Publish release
      id: publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: scripts/release.sh

    - name: Archive the release binaries
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: build/*
        if-no-files-found: error
